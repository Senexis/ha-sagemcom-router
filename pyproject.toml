[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]
# Deprecations inside Home Assistant itself and its backoff dependency, not ours.
filterwarnings = [
    "ignore:Inheritance class HomeAssistantApplication from web.Application:DeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff",
]
